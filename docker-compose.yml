services:
  database:
    container_name: db.kartographe
    image: postgres:17-alpine
    ports:
      - "5431:5432"
    networks:
      - kartograph-net
    volumes:
      - database-data:/var/lib/postgresql/data
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    container_name: api.kartographe
    build:
      context: ./apps/back
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      database:
        condition: service_healthy
    links:
      - database:db
    networks:
      - kartograph-net

  app:
    container_name: app.kartographe
    build:
      context: ./apps/front
      dockerfile: docker/Dockerfile
    ports:
      - "5173:80"
    # Injected into the bundle at container start (docker/prepare.sh replaces
    # the ##VITE_*## placeholders). Change a value + restart to repoint the app
    # without rebuilding. VITE_API_URL targets the host-published API port
    # since the fetch runs in the browser.
    env_file:
      - .env
    depends_on:
      - api
    networks:
      - kartograph-net

volumes:
  database-data:

networks:
  kartograph-net:
    driver: bridge
