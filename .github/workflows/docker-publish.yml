name: Publish Docker images

# On every git tag, build the two application images for amd64 AND arm64, push
# them to the public Docker Hub repositories, then publish a GitHub release:
#   - kartographe/kartographe-back   (apps/back)
#   - kartographe/kartographe-front  (apps/front)
#
# Each (image, platform) is built on its OWN native runner — arm64 on GitHub's
# free `ubuntu-*-arm` runners — instead of emulating arm64 with QEMU. QEMU makes
# the Vite build (transform + minify) crawl and can crash it outright
# ("qemu: uncaught target signal 4 (Illegal instruction)"). The per-platform
# images are pushed by digest, then merged into one multi-arch manifest per image.
#
# The release notes are generated from the `Changelog:` commit trailers between
# the previous tag and this one, grouped by category (like GitLab's changelog),
# plus the Docker image pull commands.
#
# Requires two repository secrets: DOCKERHUB_USERNAME and DOCKERHUB_TOKEN.

on:
  push:
    tags:
      - "*"

jobs:
  build:
    name: ${{ matrix.name }} (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: back
            image: kartographe/kartographe-back
            context: ./apps/back
            dockerfile: ./apps/back/Dockerfile
            platform: linux/amd64
            runner: ubuntu-latest
          - name: back
            image: kartographe/kartographe-back
            context: ./apps/back
            dockerfile: ./apps/back/Dockerfile
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - name: front
            image: kartographe/kartographe-front
            context: ./apps/front
            dockerfile: ./apps/front/docker/Dockerfile
            platform: linux/amd64
            runner: ubuntu-latest
          - name: front
            image: kartographe/kartographe-front
            context: ./apps/front
            dockerfile: ./apps/front/docker/Dockerfile
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.name }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}-${{ matrix.platform }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.name }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: ${{ matrix.name }} manifest
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: back
            image: kartographe/kartographe-back
          - name: front
            image: kartographe/kartographe-front

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          pattern: digests-${{ matrix.name }}-*
          path: /tmp/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          # Semver tags (v1.2.3) yield 1.2.3 / 1.2 / 1 and, when not a
          # pre-release, `latest`. `type=ref,event=tag` also mirrors the raw
          # tag name so *any* tag (even non-semver) still produces one image tag.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=tag
          flavor: |
            latest=auto

      - name: Create and push the multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ matrix.image }}@sha256:%s ' *)

      - name: Inspect
        run: docker buildx imagetools inspect ${{ matrix.image }}:${{ steps.meta.outputs.version }}

  release:
    needs: merge
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for the previous-tag..tag commit range

      - name: Build release notes
        id: notes
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          PREV="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          RANGE="${TAG}"; [ -n "$PREV" ] && RANGE="${PREV}..${TAG}"

          declare -A HEAD=(
            [added]="### ✨ Ajouts"          [fixed]="### 🐛 Corrections"
            [changed]="### ♻️ Changements"    [performance]="### ⚡ Performances"
            [security]="### 🔒 Sécurité"       [deprecated]="### ⚠️ Dépréciations"
            [removed]="### 🗑️ Suppressions"    [doc]="### 📝 Documentation"
            [other]="### 🔧 Divers" )
          ORDER="added fixed changed performance security deprecated removed doc other"

          US=$'\x1f'; RS=$'\x1e'; declare -A BUCKET
          while IFS= read -r -d "$RS" rec; do
            [ -z "$rec" ] && continue
            hash="${rec%%$US*}"; rest="${rec#*$US}"; subject="${rest%%$US*}"; cat="${rest#*$US}"
            cat="$(printf '%s' "${cat%%,*}" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
            case " $ORDER " in *" $cat "*) ;; *) cat="other";; esac
            BUCKET[$cat]+="- ${subject} ([\`${hash:0:7}\`](https://github.com/${REPO}/commit/${hash}))"$'\n'
          done < <(git log --no-merges --reverse \
                     --format="%H${US}%s${US}%(trailers:key=Changelog,valueonly,separator=%x2c)${RS}" "$RANGE")

          {
            echo "## 🐳 Images Docker"; echo
            echo '```sh'
            echo "docker pull kartographe/kartographe-back:${VERSION}"
            echo "docker pull kartographe/kartographe-front:${VERSION}"
            echo '```'; echo
            echo "[kartographe-back](https://hub.docker.com/r/kartographe/kartographe-back/tags) · [kartographe-front](https://hub.docker.com/r/kartographe/kartographe-front/tags)"; echo
            echo "## 📋 Nouveautés"
            for c in $ORDER; do
              [ -n "${BUCKET[$c]:-}" ] && { echo; echo "${HEAD[$c]}"; echo; printf '%s' "${BUCKET[$c]}"; }
            done
            [ -n "$PREV" ] && { echo; echo "**Changelog complet** : [\`${PREV}...${TAG}\`](https://github.com/${REPO}/compare/${PREV}...${TAG})"; }
          } > notes.md

          if [[ "$TAG" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file notes.md --verify-tag \
            ${{ steps.notes.outputs.prerelease == 'true' && '--prerelease' || '' }}
