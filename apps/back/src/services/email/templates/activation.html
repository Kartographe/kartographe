<!doctype html>
<html lang="en">
  <body style="margin:0;padding:0;background:#f4f5f7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1f2430;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f5f7;padding:32px 12px;">
      <tr>
        <td align="center">
          <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="max-width:480px;width:100%;background:#ffffff;border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(16,24,40,.08);">
            <tr>
              <td style="padding:28px 32px 8px;font-size:20px;font-weight:700;color:#4f46e5;">Kartographe</td>
            </tr>
            <tr>
              <td style="padding:8px 32px 4px;font-size:16px;">${greeting}</td>
            </tr>
            <tr>
              <td style="padding:8px 32px 20px;font-size:15px;line-height:1.55;color:#3a4152;">
                Welcome to Kartographe! Confirm your email address to activate your account.
              </td>
            </tr>
            <tr>
              <td style="padding:0 32px 24px;">
                <a href="${action_url}" style="display:inline-block;background:#4f46e5;color:#ffffff;text-decoration:none;font-size:15px;font-weight:600;padding:12px 24px;border-radius:8px;">Confirm my account</a>
              </td>
            </tr>
            <tr>
              <td style="padding:0 32px 28px;font-size:13px;line-height:1.5;color:#8a92a6;">
                If the button doesn't work, copy this link into your browser:<br />
                <a href="${action_url}" style="color:#4f46e5;word-break:break-all;">${action_url}</a>
              </td>
            </tr>
            <tr>
              <td style="padding:16px 32px;border-top:1px solid #eceef2;font-size:12px;color:#a0a7b8;">
                If you didn't create a Kartographe account, you can ignore this email.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
